<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Local help for Roscoe and Rockford-area business owners who are losing leads or buried in admin." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem("clockout-theme");
        } catch (e) {}
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.classList.toggle(
          "dark",
          theme === "dark" || (theme !== "light" && prefersDark),
        );
      })();
    </script>
    <title>Clockout | Fix the Bottleneck, Get Your Time Back | Roscoe, IL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
